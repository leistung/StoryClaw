# 支持的 LLM 模型列表
# format: openai_chat | anthropic | openai_responses
models:
  - id: gpt-4o
    display_name: "GPT-4o"
    format: openai_chat
    base_url: https://api.openai.com/v1
    context_limit: 128000
    enabled: true
    business_only: true
  - id: gpt-4o-mini
    display_name: "GPT-4o Mini"
    format: openai_chat
    base_url: https://api.openai.com/v1
    context_limit: 128000
    enabled: true
    business_only: true
  - id: claude-3-5-sonnet
    display_name: "Claude 3.5 Sonnet"
    format: anthropic
    base_url: https://api.anthropic.com
    context_limit: 200000
    enabled: true
    business_only: true
  - id: qwen-max
    display_name: "通义千问-Max"
    format: openai_chat
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    context_limit: 32000
    enabled: true
    business_only: true

defaults:
  default_temperature: 0.7
  default_max_tokens: 8192
