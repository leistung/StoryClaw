[project]
name = "storyclaw"
version = "0.1.0"
description = "StoryClaw LangGraph agent package: Agent Loop + Tool Use + 向量/图谱 RAG + Skill 系统"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0,<3",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0,<3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "pymilvus>=2.4.0",
    "neo4j>=5.20.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
